name: .NET Core CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Clean solution
      run: dotnet clean OGE/OGE.sln --configuration Release

    - name: Clear NuGet and MSBuild caches
      run: |
        dotnet nuget locals all --clear
        rm -rf ~/.local/share/NuGet
        rm -rf ~/.nuget

    - name: Restore dependencies
      run: dotnet restore OGE/OGE.sln

    - name: Build
      run: dotnet build OGE/OGE.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test OGE/OGE.sln --no-build --verbosity normal
